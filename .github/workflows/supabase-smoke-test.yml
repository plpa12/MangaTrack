name: Supabase integration smoke test

on:
  workflow_dispatch:
    inputs:
      confirm_temporary_write:
        description: "Confirm that the test will insert and then delete one uniquely identified temporary manga in the configured Supabase project."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke-test:
    if: ${{ inputs.confirm_temporary_write == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run authenticated Supabase read/write/read/cleanup test
        run: npm run test:supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SMOKE_TEST_EMAIL: ${{ secrets.SUPABASE_SMOKE_TEST_EMAIL }}
          SUPABASE_SMOKE_TEST_PASSWORD: ${{ secrets.SUPABASE_SMOKE_TEST_PASSWORD }}
