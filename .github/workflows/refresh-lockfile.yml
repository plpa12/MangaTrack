name: Refresh dependency lockfile (security branch)

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/refresh-lockfile.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to the PR branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh patched dependency lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
