name: MangaTrack CI

concurrency:
  group: mangatrack-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Temporary lockfile capture
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          MANGATRACK_DATA_MODE: local
      - name: Production server smoke test
        run: |
          set -e
          npm run start -- --hostname 127.0.0.1 > /tmp/mangatrack-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /tmp/mangatrack-home.html; then
              grep -q "MangaTrack" /tmp/mangatrack-home.html
              echo "Production server returned the MangaTrack homepage successfully."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mangatrack-server.log
          echo "Production server did not respond successfully within 60 seconds."
          exit 1
        env:
          MANGATRACK_DATA_MODE: local
