name: MangaTrack CI

concurrency:
  group: mangatrack-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        # Install exact resolved versions from package-lock.json.
        run: npm ci --no-audit --no-fund
      - name: Dependency vulnerability audit
        id: audit
        run: npm audit --audit-level=high
      # Continue diagnostics after an audit failure so security work does not hide test/build results.
      - name: TypeScript
        if: success() || steps.audit.outcome == 'failure'
        run: npm run typecheck
      - name: Unit tests
        if: success() || steps.audit.outcome == 'failure'
        run: npm test
      - name: Lint
        if: success() || steps.audit.outcome == 'failure'
        run: npm run lint
      - name: Production build
        if: success() || steps.audit.outcome == 'failure'
        run: npm run build
        env:
          MANGATRACK_DATA_MODE: local
      - name: Production server smoke test
        if: success() || steps.audit.outcome == 'failure'
        run: |
          set -e
          npm run start -- --hostname 127.0.0.1 > /tmp/mangatrack-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /tmp/mangatrack-home.html; then
              grep -q "MangaTrack" /tmp/mangatrack-home.html
              echo "Production server returned the MangaTrack homepage successfully."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mangatrack-server.log
          echo "Production server did not respond successfully within 60 seconds."
          exit 1
        env:
          MANGATRACK_DATA_MODE: local
